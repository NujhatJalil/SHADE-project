[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "The S.H.A.D.E. Project"
version = "0.0.1"
description = "The Systematic Heat Analysis and Data Evaluation Project @ Aggie Data Science Club, Texas A&M University (Fall 2025). Predictive modeling for heat waves,
analyzing time-series temperature data from Austin, TX (1999-2023)."
authors = [
  { project lead = "Nujhat Jalil",
    classical forecasting team lead = "Sahil Patel",
    machine learning team lead = "Hrudith Lakshminarasimman,
    hybrid team lead = "Orlando Haye"
  },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["the_s.h.a.d.e._project___adsc_f25"]
include = ["pyproject.toml", "the_s.h.a.d.e._project___adsc_f25/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["the_s.h.a.d.e._project___adsc_f25"]
force-sort-within-sections = true

