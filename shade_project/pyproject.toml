[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "the_s.h.a.d.e._project___adsc_f25"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Nujhat Jalil" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["the_s.h.a.d.e._project___adsc_f25"]
include = ["pyproject.toml", "the_s.h.a.d.e._project___adsc_f25/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["the_s.h.a.d.e._project___adsc_f25"]
force-sort-within-sections = true

